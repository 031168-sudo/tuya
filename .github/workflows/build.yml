name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      # Ошибки компиляции и упавшие тесты — в аннотации запуска (видны без скачивания журнала)
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |FAILED|AssertionError|Exception:" build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MoyDom-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MoyDom-${{ github.run_number }}
          path: MoyDom-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: MoyDom-*.apk
          make_latest: true
